name: Build Suziee Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    # Pinned to a specific image so the runner does not shift underneath us.
    runs-on: ubuntu-24.04
    # Write access is required to persist the signing keystore and to publish the
    # public GitHub Release. Pull requests from forks still get a read-only token.
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The project has no gradle/wrapper/gradle-wrapper.jar, so we do NOT use
      # ./gradlew. Instead Gradle is installed by the official action below and
      # invoked directly as `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore.
      # The very first run generated a key and committed it back to the repo (see the
      # "Persist signing keystore" step below), so every later build re-uses the SAME
      # key. That is what allows installed copies of Suziee to be updated in place.
      - name: Ensure debug signing keystore
        run: |
          if [ -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "Re-using the keystore committed to the repository."
          else
            echo "No keystore in the repository yet - generating one."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          STATUS=$?
          echo "===== COMPILE / GRADLE ERRORS ====="
          grep -E "^e: |e: file|error:|What went wrong|Execution failed for task|Caused by: " build.log | head -40 || true
          echo "===== TAIL ====="
          tail -n 45 build.log
          exit $STATUS

      # GitHub does not expose Actions step logs to unauthenticated API clients, but it
      # DOES expose check-run annotations. Re-emit the compiler errors as ::error:: lines so
      # the exact failure can be read back with
      # GET /repos/{owner}/{repo}/check-runs/{job_id}/annotations
      - name: Publish build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E "^e: |e: file|error:|What went wrong|Execution failed for task|Caused by: " build.log \
              | head -15 \
              | while IFS= read -r line; do
                  echo "::error::${line//$'\n'/ }"
                done
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Suziee-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # The workspace keystore is git-ignored, so on the very first run it only exists on
      # the runner. Commit it back once so that every future build is signed with an
      # identical key - otherwise Android rejects in-place updates with
      # "App not installed / signatures do not match". "[skip ci]" stops this commit from
      # triggering another build, and the step is non-fatal either way.
      - name: Persist signing keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          if [ -f "$GITHUB_WORKSPACE/debug.keystore" ] \
             && ! git ls-files --error-unmatch debug.keystore >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "chore: persist debug signing keystore [skip ci]"
            git push
            echo "Keystore committed for future builds."
          else
            echo "Keystore already tracked (or missing) - nothing to persist."
          fi

      # Publish a public, no-login-needed download. The asset is renamed to Suziee.apk so
      # the "latest release" URL stays stable:
      #   https://github.com/heyitssuzain/Suziee/releases/latest/download/Suziee.apk
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::No APK was produced, nothing to publish."
            exit 1
          fi
          cp "$APK" Suziee.apk

          TAG="v1.2-build-${GITHUB_RUN_NUMBER}"
          BODY="**Suziee v1.2** - anime music player for Android.

          ### Download
          Tap **Suziee.apk** under *Assets* below.

          ### Install
          1. Open the downloaded \`Suziee.apk\` on your Android phone.
          2. If Android asks, allow *Install unknown apps* for your browser or file manager.
          3. Only if a previous Suziee build was signed with an older key: uninstall it first, then install this one.

          Built automatically from commit \`${GITHUB_SHA:0:7}\` (workflow run #${GITHUB_RUN_NUMBER})."

          gh release create "$TAG" Suziee.apk \
            --title "Suziee v1.2 (build ${GITHUB_RUN_NUMBER})" \
            --notes "$BODY" \
            --latest

          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/latest"

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Write job summary
        if: always()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "## Suziee Android APK build :robot:"
            echo ""
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| APK artifact | \`Suziee-debug-APK\` |"
            echo "| APK path | \`$APK\` |"
            echo "| Public release | https://github.com/${{ github.repository }}/releases/latest |"
            echo ""
            if [ -f "$APK" ]; then
              SIZE=$(du -h "$APK" | cut -f1)
              echo "APK built successfully (size: **$SIZE**)."
              echo ""
              echo "- Anyone can download it from **Releases**:"
              echo "  https://github.com/${{ github.repository }}/releases/latest/download/Suziee.apk"
              echo "- It is also attached to this run under **Artifacts** (login required)."
            else
              echo "> :warning: APK was not produced. Check the build logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
