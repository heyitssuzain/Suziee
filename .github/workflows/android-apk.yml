name: Build Suziee Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    # Pinned to a specific image so the runner does not shift underneath us.
    runs-on: ubuntu-24.04
    # Write access is required to persist the signing keystore and to publish the
    # public GitHub Release. Pull requests from forks still get a read-only token.
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The project has no gradle/wrapper/gradle-wrapper.jar, so we do NOT use
      # ./gradlew. Instead Gradle is installed by the official action below and
      # invoked directly as `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore.
      # The very first run generated a key and committed it back to the repo (see the
      # "Persist signing keystore" step below), so every later build re-uses the SAME
      # key. That is what allows installed copies of Suziee to be updated in place.
      - name: Ensure debug signing keystore
        run: |
          if [ -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "Re-using the keystore committed to the repository."
          else
            echo "No keystore in the repository yet - generating one."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      # If the private release keystore has been added as a repository secret, decode it and
      # sign a *release* build with it. Until then we keep building debug so the workflow
      # still produces a downloadable APK instead of going red.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the private release keystore from repository secrets."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set - falling back to a debug-signed build."
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/release.keystore"
            gradle assembleRelease --stacktrace > build.log 2>&1
            STATUS=$?
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            gradle assembleDebug --stacktrace > build.log 2>&1
            STATUS=$?
            SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi

          echo "===== COMPILE / GRADLE ERRORS ====="
          grep -E "^e: |e: file|error:|What went wrong|Execution failed for task|Caused by: " build.log | head -40 || true
          echo "===== TAIL ====="
          tail -n 45 build.log

          if [ $STATUS -eq 0 ]; then
            mkdir -p dist
            cp "$SRC" dist/Suziee.apk
            echo "Packaged $SRC -> dist/Suziee.apk"
          fi
          exit $STATUS

      # GitHub does not expose Actions step logs to unauthenticated API clients, but it
      # DOES expose check-run annotations. Re-emit the compiler errors as ::error:: lines so
      # the exact failure can be read back with
      # GET /repos/{owner}/{repo}/check-runs/{job_id}/annotations
      - name: Publish build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -iE "^e: |e: file|error:|What went wrong|Execution failed for task|Caused by: " build.log \
              | head -15 \
              | while IFS= read -r line; do
                  echo "::error::${line//$'\n'/ }"
                done
          fi

      # lintVitalRelease now blocks release builds again (see app/lint.xml for the one
      # documented false positive). This step only runs when something already failed, so it
      # costs nothing on a green build, and it surfaces the lint report as annotations - the
      # only failure channel readable without GitHub auth.
      - name: Report lint findings (failure path)
        if: failure() && steps.signing.outputs.mode == 'release'
        continue-on-error: true
        run: |
          set +e
          : > lint-issues.txt

          if [ -z "$(find . -name 'lint-results*.xml' -not -path './.gradle/*' 2>/dev/null | head -n 1)" ]; then
            gradle lintRelease --stacktrace > lint.log 2>&1
          fi

          REPORTS="$(find . -name 'lint-results*.xml' -not -path './.gradle/*' -not -path './dist/*' 2>/dev/null | head -10)"
          echo "lint reports: ${REPORTS:-<none found>}"

          PY="$(command -v python3 || command -v python || true)"
          if [ -n "$PY" ] && [ -n "$REPORTS" ]; then
            for r in $REPORTS; do
              "$PY" .github/scripts/lint_issues.py "$r" >> lint-issues.txt
            done
            [ -s lint-issues.txt ] && sort -u lint-issues.txt -o lint-issues.txt
          fi

          if [ -s lint-issues.txt ]; then
            echo "===== FATAL / ERROR LINT ISSUES ====="
            head -30 lint-issues.txt
            head -30 lint-issues.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::LINT $line"
            done
          else
            echo "::warning::could not extract lint findings"
            if [ -f lint.log ]; then
              awk '/What went wrong/{f=1} f' lint.log | head -15 | sed 's/^/::error::DIAG /'
            fi
          fi
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Suziee-APK
          path: dist/Suziee.apk
          if-no-files-found: error
          retention-days: 30

      # The workspace keystore is git-ignored, so on the very first run it only exists on
      # the runner. Commit it back once so that every future build is signed with an
      # identical key - otherwise Android rejects in-place updates with
      # "App not installed / signatures do not match". "[skip ci]" stops this commit from
      # triggering another build, and the step is non-fatal either way.
      - name: Persist signing keystore
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          if [ -f "$GITHUB_WORKSPACE/debug.keystore" ] \
             && ! git ls-files --error-unmatch debug.keystore >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f debug.keystore
            git commit -m "chore: persist debug signing keystore [skip ci]"
            git push
            echo "Keystore committed for future builds."
          else
            echo "Keystore already tracked (or missing) - nothing to persist."
          fi

      # Publish a public, no-login-needed download. The asset is renamed to Suziee.apk so
      # the "latest release" URL stays stable:
      #   https://github.com/heyitssuzain/Suziee/releases/latest/download/Suziee.apk
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="dist/Suziee.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::No APK was produced, nothing to publish."
            exit 1
          fi

          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            SIGN_NOTE="Signed with the private Suziee release key."
          else
            SIGN_NOTE="**Warning:** this build is debug-signed, because the private signing key is not configured yet."
          fi

          TAG="v1.3-build-${GITHUB_RUN_NUMBER}"
          BODY="**Suziee v1.3** - anime music player for Android.

          ### Download
          Tap **Suziee.apk** under *Assets* below.

          ### Install
          1. Open the downloaded \`Suziee.apk\` on your Android phone.
          2. If Android asks, allow *Install unknown apps* for your browser or file manager.
          3. Only if a previous Suziee build was signed with an older key: uninstall it first, then install this one.

          ${SIGN_NOTE}

          Built automatically from commit \`${GITHUB_SHA:0:7}\` (workflow run #${GITHUB_RUN_NUMBER})."

          gh release create "$TAG" "$APK" \
            --title "Suziee v1.3 (build ${GITHUB_RUN_NUMBER})" \
            --notes "$BODY" \
            --latest

          echo "Release published: https://github.com/${GITHUB_REPOSITORY}/releases/latest"

      # A real gate: a failing unit test fails the run. The previous revision ran this step
      # with `continue-on-error: true`, which silently swallowed a failing assertion, so a
      # green build did *not* actually prove the matching gate was correct.
      # Robolectric's android-all sandbox jar is ~144 MB and its own downloader ignores Gradle's
      # caches, proxies and retries, so it is the flakiest thing in this workflow. It is
      # deliberately *not* hidden behind actions/cache: a restored cache entry would short-circuit
      # the sha512 verification the pre-fetch below relies on, and a cache-service error fails the
      # step, which would add a new way for this gate to go red. The download is retried across two
      # mirrors and verified instead - seconds on a public repo, and deterministic every time.
      - name: Run unit tests
        run: |
          set +e

          # --- Robolectric sandbox pre-fetch -------------------------------------------------
          # The Robolectric runner fetches its android-all sandbox jar at test time with its own
          # MavenArtifactFetcher: no Gradle cache, no proxy, and no retry. Run #37 (2026-11-23) died
          # on exactly that, for both Robolectric classes:
          #   Failed to fetch maven artifact org.robolectric:android-all-instrumented:14-robolectric-10818077-i7
          # even though the same two tests passed on 2026-10-29 and the jar is live on Maven Central
          # (HTTP 200, 151142227 bytes). A 144 MB fetch with a single attempt is simply flaky.
          #
          # MavenArtifactFetcher returns immediately when the jar is already present in Robolectric's
          # local Maven repository (it checks new File(localRepositoryDir, artifact.jarPath()).exists()),
          # so seed that exact path first with a retrying, checksum-verified download. This follows the
          # official Robolectric guidance, "Fetching android-all jars manually before running tests".
          #
          # Everything here is deliberately guarded: if the pre-fetch cannot complete for any reason
          # the old behaviour is left untouched and the build can never fail because of it.
          M2_HOME="${HOME}/.m2"
          M2_REPO="${M2_HOME}/repository"
          if [ -f "${M2_HOME}/settings.xml" ]; then
            SETTINGS_REPO="$(sed -n 's:.*<localRepository>\(.*\)</localRepository>.*:\1:p' "${M2_HOME}/settings.xml" 2>/dev/null | head -n1 | tr -d '[:space:]')"
            [ -n "${SETTINGS_REPO}" ] && M2_REPO="${SETTINGS_REPO}"
          fi
          ROBOLECTRIC_VER="14-robolectric-10818077-i7"
          ROBOLECTRIC_JAR="android-all-instrumented-${ROBOLECTRIC_VER}.jar"
          ROBOLECTRIC_DIR="${M2_REPO}/org/robolectric/android-all-instrumented/${ROBOLECTRIC_VER}"
          ROBOLECTRIC_RELPATH="org/robolectric/android-all-instrumented/${ROBOLECTRIC_VER}/${ROBOLECTRIC_JAR}"
          if [ -s "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}" ]; then
            echo "::notice::ROBOLECTRIC sandbox already present ($(du -h "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}" | cut -f1))"
          else
            mkdir -p "${ROBOLECTRIC_DIR}"
            for MIRROR in "https://repo1.maven.org/maven2" "https://repo.maven.apache.org/maven2"; do
              [ -s "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}" ] && break
              URL="${MIRROR}/${ROBOLECTRIC_RELPATH}"
              echo "::notice::ROBOLECTRIC pre-fetching ${ROBOLECTRIC_VER} from ${MIRROR}"
              curl -fL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 \
                -o "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}.part" "${URL}" 2>/dev/null || true
              if [ ! -s "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}.part" ]; then
                rm -f "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}.part"
                continue
              fi
              EXPECTED_SHA="$(curl -fsSL --retry 3 --retry-all-errors --max-time 60 "${URL}.sha512" 2>/dev/null | tr -d '\r' | cut -d' ' -f1 | tr -d '[:space:]')"
              ACTUAL_SHA="$(sha512sum "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}.part" | cut -d' ' -f1)"
              if [ -z "${EXPECTED_SHA}" ] || [ "${EXPECTED_SHA}" = "${ACTUAL_SHA}" ]; then
                [ -z "${EXPECTED_SHA}" ] && echo "::warning::ROBOLECTRIC checksum unavailable from ${MIRROR}; keeping the unverified download."
                mv "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}.part" "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}"
                echo "::notice::ROBOLECTRIC sandbox ready ($(du -h "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}" | cut -f1))"
              else
                echo "::warning::ROBOLECTRIC checksum mismatch from ${MIRROR} (expected='${EXPECTED_SHA}' actual='${ACTUAL_SHA}'); discarding and trying the next mirror."
                rm -f "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}.part"
              fi
            done
            [ -s "${ROBOLECTRIC_DIR}/${ROBOLECTRIC_JAR}" ] \
              || echo "::warning::ROBOLECTRIC sandbox could not be pre-fetched; Robolectric will attempt its own download."
          fi

          # `--no-configuration-cache` is deliberate. The project sets
          # org.gradle.configuration-cache=true, and the build step above cached an entry for a
          # completely different task set (assembleDebug). Handing a task-less "BUILD FAILED" back
          # in that situation is a well known Gradle failure mode, and it is exactly the shape of
          # the failure this step hit: it died in seconds, before a single task ever ran, and
          # produced no test-results XML. Disabling the cache for this one invocation removes that
          # whole failure class without touching the build step's caching.
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-configuration-cache \
            > test-attempt1.log 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Unit tests failed on attempt 1 (exit $STATUS); retrying once with every cache bypassed, to tell a real failure apart from a transient one."
            gradle :app:testDebugUnitTest --stacktrace --console=plain \
              --no-configuration-cache --no-build-cache --refresh-dependencies \
              > test.log 2>&1
            STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "::notice::Retry passed - attempt 1 was a transient failure, not a test failure."
            fi
          else
            cp test-attempt1.log test.log
          fi
          echo "===== RUNNER HEADROOM ====="
          df -h . | tail -1
          echo "::notice::DISK $(df -h . | tail -1 | sed 's/%/%25/g')"
          echo "===== TEST OUTPUT (tail) ====="
          tail -n 40 test.log
          echo "===== TEST ERRORS ====="
          grep -E "^e: |error: |FAILED|tests completed" test.log | head -30 || true
          exit $STATUS

      # Emit the results as check-run annotations: GitHub does not expose Actions step logs to
      # unauthenticated clients, but annotations are readable without auth. The per-class
      # counts are what prove which tests actually ran (and passed) in this run.
      - name: Publish test results
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "===== PER-CLASS RESULTS ====="
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            name="$(basename "$f" .xml)"
            head="$(head -5 "$f" | tr '\n' ' ')"
            t="$(printf '%s' "$head" | grep -oE 'tests="[0-9]+"' | head -1)"
            fl="$(printf '%s' "$head" | grep -oE 'failures="[0-9]+"' | head -1)"
            er="$(printf '%s' "$head" | grep -oE 'errors="[0-9]+"' | head -1)"
            echo "::notice::TESTRESULT ${name} ${t} ${fl} ${er}"
          done
          echo "===== FAILURES ====="
          grep -rhoE '<failure[^>]*message="[^"]{0,220}' \
            app/build/test-results/testDebugUnitTest 2>/dev/null | head -5 \
            | while IFS= read -r line; do echo "::error::TESTFAIL ${line//%/%25}"; done

          # The <failure> element's body holds the full stack trace of a failing test. Its
          # "Caused by:" chain is the only place the real reason for a mid-test failure (for
          # example a Robolectric sandbox download error) is visible, because Gradle's own
          # output does not echo test stack traces. Surface that chain explicitly.
          grep -rhoE 'Caused by: [^<]{0,240}' \
            app/build/test-results/testDebugUnitTest 2>/dev/null | sort -u | head -8 \
            | while IFS= read -r line; do echo "::error::TESTCAUSE ${line//%/%25}"; done
          grep -rhoE '(Failed to fetch|Unable to resolve|Could not (resolve|download)|No such file)[^<]{0,200}' \
            app/build/test-results/testDebugUnitTest 2>/dev/null | sort -u | head -8 \
            | while IFS= read -r line; do echo "::error::TESTREASON ${line//%/%25}"; done

          grep -E "^e: |error: |FAILED|Execution failed for task" test.log 2>/dev/null | head -8 \
            | while IFS= read -r line; do echo "::error::TESTLOG ${line//%/%25}"; done

          # Actions step logs need admin rights to read, but check-run annotations do not. So a
          # failed run has to carry its own explanation: re-emit the whole Gradle failure block
          # (the "FAILURE: Build failed" head plus the --stacktrace "Caused by" chain) line by
          # line. Without this, a pre-execution failure leaves no readable trace at all.
          emit_gradle_failure() {
            file="$1"; limit="$2"; level="$3"
            # Match unanchored on purpose: this must survive a leading BOM or any stray prefix.
            awk '/FAILURE: Build failed/{f=1} f' "$file" \
              | head -"$limit" | tr -d '\r' \
              | while IFS= read -r line; do
                  echo "::$level::GLOG ${line//%/%25}"
                done
          }
          if [ -f test.log ] && grep -q "BUILD FAILED" test.log; then
            emit_gradle_failure test.log 20 error
          fi
          if [ -f test-attempt1.log ] && grep -q "BUILD FAILED" test-attempt1.log; then
            if grep -q "BUILD FAILED" test.log 2>/dev/null; then
              emit_gradle_failure test-attempt1.log 8 error
            else
              echo "::warning::attempt 1 failed but the retry passed, so attempt 1 was transient. Attempt 1's Gradle failure block follows:"
              emit_gradle_failure test-attempt1.log 8 warning
            fi
          fi
          exit 0

      - name: Write job summary
        if: always()
        run: |
          APK="dist/Suziee.apk"
          {
            echo "## Suziee Android APK build :robot:"
            echo ""
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Signing | \`${{ steps.signing.outputs.mode }}\` |"
            echo "| APK artifact | \`Suziee-APK\` |"
            echo "| APK path | \`$APK\` |"
            echo "| Public release | https://github.com/${{ github.repository }}/releases/latest |"
            echo ""
            if [ -f "$APK" ]; then
              SIZE=$(du -h "$APK" | cut -f1)
              echo "APK built successfully (size: **$SIZE**)."
              echo ""
              echo "- Anyone can download it from **Releases**:"
              echo "  https://github.com/${{ github.repository }}/releases/latest/download/Suziee.apk"
              echo "- It is also attached to this run under **Artifacts** (login required)."
            else
              echo "> :warning: APK was not produced. Check the build logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
