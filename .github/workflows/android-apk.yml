name: Build Suziee Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    # Pinned to a specific image so the runner does not shift underneath us.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The project has no gradle/wrapper/gradle-wrapper.jar, so we do NOT use
      # ./gradlew. Instead Gradle is installed by the official action below and
      # invoked directly as `gradle`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # app/build.gradle.kts signs the debug build with ${rootDir}/debug.keystore,
      # which is git-ignored. Generate one fresh on the runner.
      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Suziee-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Write job summary
        if: always()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "## Suziee Android APK build :robot:"
            echo ""
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| Status | \`${{ job.status }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| APK artifact | \`Suziee-debug-APK\` |"
            echo "| APK path | \`$APK\` |"
            echo ""
            if [ -f "$APK" ]; then
              SIZE=$(du -h "$APK" | cut -f1)
              echo "APK built successfully (size: **$SIZE**). Download it from the **Artifacts** section of this run."
            else
              echo "> :warning: APK was not produced. Check the build logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
